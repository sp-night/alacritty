# SP Night — Pico do Jaraguá
# A mesma noite, vista do ponto mais alto da cidade. O escuro do noite girado para o verde da mata fechada — e a torre vermelha e branca acesa no topo.
#
# Generated from the SP Night palette — do not edit by hand.
# https://github.com/sp-night/alacritty
#
# install: ~/.config/alacritty/themes/sp_night_jaragua.toml
# enable:  import = ["~/.config/alacritty/themes/sp_night_jaragua.toml"]   (under [general] since Alacritty 0.14, top level on 0.13)

# The plane everything sits on. `dim_foreground` is the one Alacritty would
# calculate for itself; naming it keeps faint text inside the measured palette
# instead of at whatever a multiplier lands on.
#
# `bright_foreground` used to be absent here, and the reason was honest at the
# time: the role layer had no colour above `ui.fg` for text, so the key would
# have written `fg` twice and claimed a lift that did not exist. The palette
# since gained `fg_vivo`, and `ui.fg_bright` resolves to it — a measured colour
# that has been through the same contrast audit as the rest. So the key is set,
# and it is set to the same value `ansi.bright_white` now carries, which is what
# keeps bold text and bright white from disagreeing about what "brighter" means.
[colors.primary]
background        = "#0c100d"
foreground        = "#d3dad5"
dim_foreground    = "#868b87"
bright_foreground = "#e7eee9"

# The signature colour, with dark text inside it.
[colors.cursor]
cursor = "#f2984a"
text   = "#050806"

# Vi mode is a different mode, not a dimmer one, so the cursor changes hue rather
# than brightness. Blue is the system accent everywhere else in this theme.
[colors.vi_mode_cursor]
cursor = "#6e92de"
text   = "#050806"

[colors.selection]
background = "#202622"
text       = "#d3dad5"

# Search. Every hit takes the match colour, and the one the cursor is on takes the
# signature colour, so the position is never lost among the others.
[colors.search.matches]
background = "#f5c66b"
foreground = "#050806"

[colors.search.focused_match]
background = "#f2984a"
foreground = "#050806"

# A hint label reads left to right, so the character to press next is loud and the
# rest of the label stays on concrete.
[colors.hints.start]
background = "#f2984a"
foreground = "#050806"

[colors.hints.end]
background = "#151a17"
foreground = "#d3dad5"

# The search prompt and the URI preview sit on exposed concrete; the line and
# column readout recedes into the deepest surface.
[colors.footer_bar]
background = "#151a17"
foreground = "#d3dad5"

[colors.line_indicator]
background = "#050806"
foreground = "#868b87"

# The 16 ANSI colours. [colors.dim] is deliberately absent: the palette has no
# measured dim ladder, and a project that gates on contrast should not ship a
# third set of colours nobody checked. Alacritty derives faint text on its own.
[colors.normal]
black   = "#050806"
red     = "#ea5d5d"
green   = "#79d488"
yellow  = "#f5c66b"
blue    = "#6e92de"
magenta = "#b094e2"
cyan    = "#60bfb8"
white   = "#868b87"

[colors.bright]
black   = "#707471"
red     = "#ff716f"
green   = "#8ce99b"
yellow  = "#ffdc9c"
blue    = "#80a5f2"
magenta = "#c3a7f6"
cyan    = "#73d2cb"
white   = "#e7eee9"
